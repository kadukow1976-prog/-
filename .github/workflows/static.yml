<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Общая база — редактор Google Sheets</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f172a" />
  <style>
    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#475569}
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased">
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <header class="mb-4">
      <h1 class="text-2xl md:text-3xl font-semibold">Общая база — выбор файла</h1>
      <p class="text-slate-400">Выберите файл. Ниже откроется редактор (Apps Script) внутри iframe.</p>
    </header>

    <!-- Список файлов -->
    <section id="list" class="grid gap-3 md:gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 mb-4"></section>

    <!-- Редактор -->
    <section class="rounded-xl border border-slate-700 overflow-hidden">
      <iframe id="frame" src="" class="w-full" style="height: 900px; border:0;" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
  </main>

  <script>
    // 1) URL вашего Apps Script веб-приложения (из «Развернуть → Веб-приложение»)
    const WEBAPP = 'https://kadukow1976-prog.github.io/shobo-prices/'; // пример: https://script.google.com/macros/s/AKfycb.../exec

    // 2) Список доступных файлов (alias должен совпадать с APP.FILES в Code.gs)
    const FILES = [
      { alias: 'clients', title: 'Клиенты',  desc: 'Карточки клиентов' },
      { alias: 'orders',  title: 'Заказы',   desc: 'Журнал заказов'   },
      { alias: 'stock',   title: 'Склад',    desc: 'Остатки и приходы'}
    ];

    const listEl = document.getElementById('list');
    const frame  = document.getElementById('frame');

    // Рендер карточек
    for (const f of FILES) {
      const card = document.createElement('div');
      card.className =
        "bg-slate-800/60 border border-slate-700 rounded-xl p-4 hover:bg-slate-800 transition";
      card.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-lg font-semibold">${escapeHtml(f.title)}</div>
            <div class="text-slate-400 text-sm">alias: <span class="font-mono">${escapeHtml(f.alias)}</span></div>
            <div class="text-slate-400 text-sm mt-1">${escapeHtml(f.desc||'')}</div>
          </div>
          <button data-a="${f.alias}"
                  class="shrink-0 inline-flex items-center gap-2 px-3 py-2 rounded-lg
                         bg-emerald-500 text-slate-900 font-semibold border border-emerald-600
                         hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            Открыть
          </button>
        </div>`;
      listEl.appendChild(card);
    }

    // Обработка кликов
    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-a]');
      if (!btn) return;
      const alias = btn.dataset.a;
      frame.src = WEBAPP + '?file=' + encodeURIComponent(alias);
      frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    function escapeHtml(s) {
      return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
